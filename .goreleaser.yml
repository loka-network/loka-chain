# goreleaser v2 configuration.
# Run `make release-dry-run` locally before pushing a v*.*.* tag.
version: 2

project_name: lokad

before:
  hooks:
    - go mod download

builds:
  - id: "lokad-darwin"
    main: ./cmd/lokad
    binary: bin/lokad
    env:
      - CGO_ENABLED=1
      - CC=o64-clang
      - CXX=o64-clang++
    goos:
      - darwin
    goarch:
      - amd64
    flags:
      - -tags=cgo
    ldflags:
      - -s -w -X github.com/cosmos/cosmos-sdk/version.Name=loka -X github.com/cosmos/cosmos-sdk/version.AppName=lokad -X github.com/cosmos/cosmos-sdk/version.Version={{.Version}} -X github.com/cosmos/cosmos-sdk/version.Commit={{.Commit}}
  - id: "lokad-darwin-arm64"
    main: ./cmd/lokad
    binary: bin/lokad
    env:
      - CGO_ENABLED=1
      - CC=oa64-clang
      - CXX=oa64-clang++
    goos:
      - darwin
    goarch:
      - arm64
    flags:
      - -tags=cgo
    ldflags:
      - -s -w -X github.com/cosmos/cosmos-sdk/version.Name=loka -X github.com/cosmos/cosmos-sdk/version.AppName=lokad -X github.com/cosmos/cosmos-sdk/version.Version={{.Version}} -X github.com/cosmos/cosmos-sdk/version.Commit={{.Commit}}
  - id: "lokad-linux"
    main: ./cmd/lokad
    binary: bin/lokad
    env:
      - CGO_ENABLED=1
      - CC=gcc
      - CXX=g++
    goos:
      - linux
    goarch:
      - amd64
    flags:
      - -tags=cgo
    ldflags:
      - -s -w -X github.com/cosmos/cosmos-sdk/version.Name=loka -X github.com/cosmos/cosmos-sdk/version.AppName=lokad -X github.com/cosmos/cosmos-sdk/version.Version={{.Version}} -X github.com/cosmos/cosmos-sdk/version.Commit={{.Commit}}
  - id: "lokad-linux-arm64"
    main: ./cmd/lokad
    binary: bin/lokad
    env:
      - CGO_ENABLED=1
      - CC=aarch64-linux-gnu-gcc
      - CXX=aarch64-linux-gnu-g++
    goos:
      - linux
    goarch:
      - arm64
    flags:
      - -tags=cgo
    ldflags:
      - -s -w -X github.com/cosmos/cosmos-sdk/version.Name=loka -X github.com/cosmos/cosmos-sdk/version.AppName=lokad -X github.com/cosmos/cosmos-sdk/version.Version={{.Version}} -X github.com/cosmos/cosmos-sdk/version.Commit={{.Commit}}
  - id: "lokad-windows"
    main: ./cmd/lokad
    binary: bin/lokad
    env:
      - CGO_ENABLED=1
      - CC=x86_64-w64-mingw32-gcc
      - CXX=x86_64-w64-mingw32-g++
    goos:
      - windows
    goarch:
      - amd64
    flags:
      - -tags=cgo
      - -buildmode=exe
    ldflags:
      - -s -w -X github.com/cosmos/cosmos-sdk/version.Name=loka -X github.com/cosmos/cosmos-sdk/version.AppName=lokad -X github.com/cosmos/cosmos-sdk/version.Version={{.Version}} -X github.com/cosmos/cosmos-sdk/version.Commit={{.Commit}}

archives:
  - name_template: '{{ .ProjectName }}_{{ .Version }}_{{- title .Os }}_{{ .Arch }}'
    # v2 renamed `format` -> `formats` (list) inside format_overrides.
    format_overrides:
      - goos: windows
        formats: [zip]
    # `builds:` (NOT `ids:`) selects which build IDs are bundled into this
    # archive. The renaming I expected was only on format_overrides[].format.
    builds:
      - lokad-darwin
      - lokad-darwin-arm64
      - lokad-windows
      - lokad-linux
      - lokad-linux-arm64

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

# v2 renamed `snapshot.name_template` -> `snapshot.version_template`
# (and operates on the Version field, not the Tag field, for cleaner output).
snapshot:
  version_template: "{{ .Tag }}-next"
